name: zero

services:
  mail:
    image: zero-mail-runtime
    build:
      context: .
      dockerfile: docker/mail/Dockerfile
      args:
        VITE_PUBLIC_APP_URL: ${VITE_PUBLIC_APP_URL:-http://localhost:3000}
        VITE_PUBLIC_BACKEND_URL: ${VITE_PUBLIC_BACKEND_URL:-http://localhost:8787}
        VITE_PUBLIC_IMAGE_PROXY: ${VITE_PUBLIC_IMAGE_PROXY:-}
        VITE_PUBLIC_IMAGE_API_URL: ${VITE_PUBLIC_IMAGE_API_URL:-}
    container_name: zerodotemail-mail
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '${ZERO_MAIL_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '--quiet', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  server:
    image: zero-server
    container_name: zerodotemail-server
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    environment:
      NODE_ENV: production
      ZERO_SERVER_HOST: 0.0.0.0
      ZERO_SERVER_PORT: '8787'
      ZERO_SHUTDOWN_GRACE_MS: ${ZERO_SHUTDOWN_GRACE_MS:-30000}
      DATABASE_URL: '${DATABASE_URL:?DATABASE_URL is required}'
      MAIL_BLOB_STORE: s3
      MAIL_BLOB_S3_ENDPOINT: ${MAIL_BLOB_S3_ENDPOINT:-}
      MAIL_BLOB_S3_REGION: ${MAIL_BLOB_S3_REGION:-}
      MAIL_BLOB_S3_BUCKET: ${MAIL_BLOB_S3_BUCKET:-}
      MAIL_BLOB_S3_PREFIX: ${MAIL_BLOB_S3_PREFIX:-}
      MAIL_BLOB_S3_FORCE_PATH_STYLE: ${MAIL_BLOB_S3_FORCE_PATH_STYLE:-false}
      MAIL_BLOB_S3_ACCESS_KEY_ID: ${MAIL_BLOB_S3_ACCESS_KEY_ID:-}
      MAIL_BLOB_S3_SECRET_ACCESS_KEY: ${MAIL_BLOB_S3_SECRET_ACCESS_KEY:-}
      VITE_PUBLIC_APP_URL: ${VITE_PUBLIC_APP_URL:-http://localhost:3000}
      VITE_PUBLIC_BACKEND_URL: ${VITE_PUBLIC_BACKEND_URL:-http://localhost:8787}
      BASE_URL: ${BASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NANGO_BASE_URL: ${NANGO_BASE_URL:-}
      NANGO_SECRET_KEY: ${NANGO_SECRET_KEY:-}
      REDIS_URL: http://upstash-proxy:80
      REDIS_TOKEN: ${REDIS_TOKEN:-upstash-local-token}
      MAIL_PROTOCOL_ALLOWED_HOSTS: ${MAIL_PROTOCOL_ALLOWED_HOSTS:-}
      INTEGRATION_API_TOKEN: ${INTEGRATION_API_TOKEN:-}
      MAIL_WEBHOOK_ENABLED: ${MAIL_WEBHOOK_ENABLED:-false}
      MAIL_WEBHOOK_URL: ${MAIL_WEBHOOK_URL:-}
      NANGO_GMAIL_INTEGRATION_KEY: ${NANGO_GMAIL_INTEGRATION_KEY:-google-mail}
      NANGO_OUTLOOK_INTEGRATION_KEY: ${NANGO_OUTLOOK_INTEGRATION_KEY:-outlook}
      NANGO_ZOHO_MAIL_INTEGRATION_KEY: ${NANGO_ZOHO_MAIL_INTEGRATION_KEY:-zoho-mail}
      NANGO_IMAP_SMTP_INTEGRATION_KEY: ${NANGO_IMAP_SMTP_INTEGRATION_KEY:-generic-email}
      ZERO_ADMIN_AUTO_PROVISION: ${ZERO_ADMIN_AUTO_PROVISION:-false}
      ZERO_ADMIN_NAME: ${ZERO_ADMIN_NAME:-}
      ZERO_ADMIN_EMAIL: ${ZERO_ADMIN_EMAIL:-}
      ZERO_ADMIN_PASSWORD: ${ZERO_ADMIN_PASSWORD:-}
      ZERO_ADMIN_BOOTSTRAP_SECRET: ${ZERO_ADMIN_BOOTSTRAP_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    restart: unless-stopped
    depends_on:
      upstash-proxy:
        condition: service_healthy
    ports:
      - '${ZERO_SERVER_PORT:-8787}:8787'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  valkey:
    container_name: zerodotemail-redis
    image: docker.io/bitnami/valkey:latest
    restart: unless-stopped
    environment:
      ALLOW_EMPTY_PASSWORD: 'yes'
      VALKEY_DISABLE_COMMANDS: FLUSHDB,FLUSHALL
    ports:
      - '${VALKEY_PORT:-6379}:6379'
    volumes:
      - valkey-data:/bitnami/valkey/data
    healthcheck:
      test: ['CMD', 'valkey-cli', '-h', '127.0.0.1', '-p', '6379', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  upstash-proxy:
    container_name: zerodotemail-upstash-proxy
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${REDIS_TOKEN:-upstash-local-token}
      SRH_CONNECTION_STRING: redis://valkey:6379
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - '${REDIS_HTTP_PORT:-8079}:80'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '--quiet', 'http://127.0.0.1:80']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  valkey-data:
